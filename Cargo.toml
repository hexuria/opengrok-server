# OpenGrok — the server the coworkers live on.
#
# Crate-per-concern, mirroring open-ai-gateway's layout, because the two ship together and a
# reader who knows one should be able to navigate the other. The dependency direction is a
# straight line: core knows nothing, everything else knows core.
[workspace]
resolver = "3"
members = [
  "crates/opengrok",   # the binary: wires the server, embeds the gateway
  "crates/opengrok-core",    # domain types, ids, errors. No I/O.
  "crates/opengrok-wire",    # the client contract: gateway commands, transcript entries, activity
  "crates/opengrok-harness", # the agent loop: turns, tools, streaming
  "crates/opengrok-box",     # the coworker's computer
  "crates/opengrok-plugins",# Agent Plugins: the bundle of skills + MCP servers a coworker is given
  "crates/opengrok-tools",   # tool definitions and the executor
  "crates/opengrok-recipes", # a taught tape into the box's recipe steps; the lint that keeps them runnable
  "crates/opengrok-policy",  # what a principal may make a coworker do
  "crates/opengrok-store",   # Postgres: coworkers, transcripts, runs, the fan-out ledger
  "crates/opengrok-server",  # Axum: the host-facing API and the event stream
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "trace", "limit", "request-id", "timeout", "cors", "fs"] }
# 0.13 to match rmcp's, so the binary carries ONE http client and one TLS stack rather than two.
# Its feature names differ from 0.12: `rustls-tls` became `rustls`, and `form` and `query` are now
# opt-in rather than always present.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form", "query"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "json", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# The connect-only client for a grok-box guest (hexuria/box): exec, files and computer use over
# the box's own HTTP API. Pinned to a commit so a box-side change is a deliberate bump here.
grok-box = { git = "https://github.com/hexuria/box", rev = "6af8ae6" }
# The TXT lookup behind domain-ownership proof (12.later). rustls to match reqwest's TLS stack.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"

# The agent stack, pinned here so the versions are a recorded decision rather than drift.
# rig-core: PINNED BUT UNCLAIMED — no member crate declares it, so nothing here compiles it.
#   It was a second `ModelDoor` (`OG_MODEL_DOOR=rig`), retired because rig did not put the model
#   on the wire: the gateway saw a modelless request, classified it by policy, and answered on
#   whatever rung the classifier picked, so every coworker's pin was silently ignored. That cost a
#   night on 8 Sep 2026. `GatewayDoor` is now the only way out, and it is the one whose failure
#   modes we have read line by line.
#   The pin stays because the half of rig we never used is the half worth having — embeddings,
#   vector_store, rerank, loaders. When searchable memory lands, `rig-core.workspace = true` in
#   whichever crate wants it is the whole re-adoption, and it belongs nowhere near the harness.
rig-core = "0.42"
# rmcp: the official MCP SDK. Client-side first: mem0/OpenMemory and cua integrate as MCP servers
#   we connect to, not as code we write.
rmcp = { version = "3", default-features = false, features = [
  "client",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
  # Server-side: the /mcp door on opengrok-server. Same SDK both directions on purpose —
  # but the door's integration test drives it with a hand-written JSON-RPC client, because
  # rmcp-to-rmcp only proves the two halves share an interpretation.
  "server",
  "transport-streamable-http-server",
] }
# Cron parsing for the scheduler. Parsing only — the ticking is ours, in the same sweep pattern
#   as recovery, so firing stays durable and policy-checked rather than delegated to a framework.
cron = "0.17"
# Constant-time equality for the gateway bearer. The shipped host compares its token
#   timing-safe; a port that string-compares invites the classic byte-at-a-time probe.
subtle = "2"
# Slice 1 (auth): our own JWTs. The client base64url-decodes the payload itself and reads
#   sub/email/exp, so the access token has to be a real JWT — see opengrok-server/src/auth/token.rs.
# `rust_crypto` rather than `aws_lc_rs`: jsonwebtoken 11 refuses to pick a provider by itself, and
#   the pure-Rust one keeps a C toolchain out of the CI image. Exactly one must be enabled.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11"
# Password hashing for credential accounts. Argon2id — a real KDF; ChaCha20/SHA-256 already in the
#   tree are AEAD/hash, neither is a password hash. `password-hash` gives the PHC string format.
argon2 = "0.5"
rand = "0.10"
base64 = "0.23"
# The credential vault. An AEAD so a tampered ciphertext fails to open rather than decrypting to
# something else; pure Rust, so no C toolchain enters the build for it.
chacha20poly1305 = "0.11"
# Jev, TypeSafe AI's classifier — the owner's own SDK (codeitlikemiley/typesafe-sdk-rust), not a
# hand-rolled client: it types the three answer kinds and their calibrated probabilities, and a
# hand-rolled one would have to re-derive that decoding from the wire every time it changed.
#
# IT BRINGS A SECOND HTTP STACK, and that is a known cost rather than an oversight. The pin above
# says reqwest 0.13 so the binary carries ONE client and one TLS stack; this crate pins
# `reqwest =0.11.27` internally, so hyper 0.14 and a second rustls enter the dependency graph with
# it. Nothing can be done from this side — its `http_client()` seam takes a 0.11 `Client`, so our
# own cannot be lent to it — and the alternative the issue rules out is writing the client
# ourselves. Worth revisiting if the SDK ever moves forward a major version.
typesafe-sdk = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
