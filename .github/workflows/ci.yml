# The gate every slice must pass. Mirrors the local commands exactly — if these diverge, the local
# ritual stops predicting CI and people stop trusting either.
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: oag
          POSTGRES_PASSWORD: oag
          POSTGRES_DB: opengrok
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The streaming path, end to end over a real socket, with no provider and no key. This is
      # what the mock door is for — without it this path would only ever be tested by hand.
      - name: smoke the ag-ui endpoint against the mock door
        env:
          PGPASSWORD: oag
        run: |
          OG_BIND=127.0.0.1:1337 \
          OG_DATABASE_URL=postgres://oag:oag@127.0.0.1:5432/opengrok \
          OG_TOKEN_SECRET=$(openssl rand -hex 32) \
          OG_MODEL_DOOR=mock \
          cargo run --quiet &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:1337/health >/dev/null 2>&1 && break
            sleep 1
          done
          scripts/slice3-harness-smoke.sh
          scripts/slice2-agui-smoke.sh
      # The founding promise, checked: kill the server mid-run and the work is still there.
      # This one starts and kills its own servers, so it must not run against the one above.
      - name: prove a run survives the process
        run: |
          pkill -f 'target/debug/opengrok' || true
          sleep 1
          OG_DATABASE_URL=postgres://oag:oag@127.0.0.1:5432/opengrok \
          scripts/slice4-durability-smoke.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Next 16 generates the global route types (LayoutProps, PageProps) that the app's own files
      # reference. Without this, tsc fails in CI on types that exist locally only because a dev
      # server happened to have written them.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
