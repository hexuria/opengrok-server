# The gate every slice must pass.
#
# CI runs `scripts/gate.sh --smoke` — the SAME script a developer runs, not a copy of its steps.
# The previous version listed the commands again and drifted: it still built the Next.js scaffold
# that slice 13 replaced with a Bun/Vite SPA, and ran six of what are now twenty-one smokes. A gate
# that lists its own steps is a gate that will disagree with the local one; calling the script is
# how the two stay honest.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The full set, nightly: a push to main runs only the checks suite, so this is where two merges
  # that are each fine and broken together are caught.
  schedule:
    - cron: "41 2 * * *"
  # One suite on demand, on any branch: the Actions tab's "Run workflow" button.
  workflow_dispatch:
    inputs:
      suite:
        description: which suite to run
        type: choice
        options: [all, server, checks, formal, web, docs]
        default: all

# A new push to a pull request cancels the run it replaces; each push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables keep file and line in panics and backtraces. Full debuginfo only made compiling,
  # linking and the rust-cache archive bigger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Which suites this run needs: the event, a pull request's branch prefix (doc-*, formal-*,
  # web-*) and what it changed decide (scripts/ci-scope.sh; the table is in docs/setup/gate.md,
  # "CI suites"). server, formal and web run unless scope says `false`, so a scope that dies
  # before answering runs them all; checks and docs run only when asked for.
  scope:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.scope.outputs.server }}
      checks: ${{ steps.scope.outputs.checks }}
      formal: ${{ steps.scope.outputs.formal }}
      web: ${{ steps.scope.outputs.web }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request checkout is a merge commit; its first parent is the base.
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref }}
          SUITE: ${{ inputs.suite }}
        run: scripts/ci-scope.sh >> "$GITHUB_OUTPUT"
      # A prefixed branch that changes files outside its suite: red, with the reason, and the
      # suites stay skipped. A name may narrow what runs; it may never skip tests for code.
      - name: branch prefix matches the diff
        if: ${{ steps.scope.outputs.guard != '' }}
        env:
          GUARD: ${{ steps.scope.outputs.guard }}
        run: |
          echo "::error::$GUARD"
          exit 1

  # Docs a test reads: run those tests, not the whole gate. They are plain std, so rustc builds
  # them without the server (about two seconds, against the gate's seven minutes). If
  # setup_docs.rs ever needs a crate, this compile fails and says so.
  docs:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - name: crates/opengrok/tests/setup_docs.rs
        run: |
          CARGO_MANIFEST_DIR="$PWD/crates/opengrok" rustc --edition 2024 --test \
            crates/opengrok/tests/setup_docs.rs -o "$RUNNER_TEMP/setup_docs"
          "$RUNNER_TEMP/setup_docs"

  # What a push to main runs: the gate's checks without its tests (`gate.sh --checks`). The pull
  # request already ran the tests on this merge result; the nightly run repeats them.
  checks:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install the pinned CI tools
        run: scripts/install-ci-tools.sh | tail -1 >> "$GITHUB_PATH"
      - name: scripts/gate.sh --checks
        run: scripts/gate.sh --checks

  server:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.server != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: oag
          POSTGRES_PASSWORD: oag
          POSTGRES_DB: opengrok_gate
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The gate owns this database, and the Postgres-backed tests read the same variable — so
      # `cargo test --workspace` actually RUNS them here instead of skipping loudly.
      OG_DATABASE_URL: postgres://oag:oag@127.0.0.1:5432/opengrok_gate
      PGPASSWORD: oag
    steps:
      - uses: actions/checkout@v4
      # The version comes from rust-toolchain.toml — the same compiler a developer runs. `@stable`
      # floated ahead of every desk and failed the gate on lints nobody could reproduce locally.
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # nextest and cargo-deny, pinned by sha256. The gate uses them when they are on PATH: nextest
      # runs the test binaries at once, and cargo-deny is the supply-chain check (deny.toml).
      - name: install the pinned CI tools
        run: scripts/install-ci-tools.sh | tail -1 >> "$GITHUB_PATH"
      # Four smokes are handed their own database so they cannot race the shared one; the gate
      # derives the names and expects them to exist.
      - name: create the databases the gate expects
        run: |
          for db in opengrok_s17_gate opengrok_s18_gate opengrok_s19_gate opengrok_s21_gate; do
            psql "postgres://oag:oag@127.0.0.1:5432/postgres" -c "create database $db" || true
          done
      # A crate that grows past its recorded ceiling is how 36k-line opengrok-server
      # happened once. The check only ratchets down, so a red main is never the new normal.
      - name: crate size ceilings
        run: bash scripts/crate-size.sh
      # The gate does not build; a stale binary is the classic way to test yesterday's code.
      - name: build the server the smokes run
        run: cargo build -p opengrok
      - name: scripts/gate.sh --smoke
        run: scripts/gate.sh --smoke

  # The TLA+ models and Lean proofs in formal/: every configuration must give its expected result
  # (formal/README.md). Under a minute, so it runs on every code change and every push to main; a
  # model is only worth having if a change that breaks what it proved cannot merge green. A
  # formal-* branch runs it alone.
  formal:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.formal != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: install TLC and Lean (pinned by sha256)
        run: |
          scripts/install-tla.sh
          scripts/install-lean.sh | tail -1 >> "$GITHUB_PATH"
      - name: scripts/formal.sh --require
        run: scripts/formal.sh --require

  web:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Bun, not npm: the console is a Bun/Vite/React SPA with a bun.lock and no package-lock.json,
      # which is why the old npm cache step could not resolve its dependency path.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
