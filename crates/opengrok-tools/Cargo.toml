[package]
name = "opengrok-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dev-dependencies]
# `test-util` for the paused clock: the workflow engine's wall-clock bound is asserted in
# milliseconds of virtual time rather than by making the suite sit out a real budget.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
axum.workspace = true
# A stand-in server whose event stream never delivers, for the call-deadline tests.
futures.workspace = true

[lints]
workspace = true

[dependencies]
opengrok-core = { path = "../opengrok-core" }
opengrok-box = { path = "../opengrok-box" }
opengrok-policy = { path = "../opengrok-policy" }
opengrok-plugins = { path = "../opengrok-plugins" }
opengrok-recipes = { path = "../opengrok-recipes" }
rmcp.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
