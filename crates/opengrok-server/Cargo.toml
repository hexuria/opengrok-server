[package]
name = "opengrok-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# ON BY DEFAULT so a deployment with OG_JEV_API_KEY keeps the live TypeSafe client. `dep:` so
# cargo does not invent a feature named typesafe-sdk. Off, the binary carries one reqwest and
# one hyper.
default = ["jev"]
jev = ["opengrok-jev/jev"]
# Records the wire NativeChat reads while `OG_RECORD_WIRE` is set (#255, `tests/support/wire_record.rs`).
# Only this crate's own tests turn it on, through the dev-dependency on itself below; the
# shipped binary never carries it.
record-wire = []

[dev-dependencies]
# Builds the PDFs the attachment tests read (#229): the parser `pdf-extract` reads them with.
lopdf = "0.42"
opengrok-server = { path = ".", default-features = false, features = ["record-wire"] }
# The clocks a test shortens on the events stream (`Hub::tune`).
opengrok-events = { path = "../opengrok-events" }
sqlx.workspace = true
base64.workspace = true
reqwest.workspace = true
# What a test reads back from the log: a refused computer is said at warn (#301).
tracing-subscriber.workspace = true

[lints]
workspace = true

[dependencies]
opengrok-plugin-api = { path = "../opengrok-plugin-api" }
opengrok-integrations = { path = "../opengrok-integrations" }
opengrok-gateway-admin = { path = "../opengrok-gateway-admin" }
opengrok-jev = { path = "../opengrok-jev" }
opengrok-local-exec = { path = "../opengrok-local-exec" }
opengrok-auth = { path = "../opengrok-auth" }
# Reversible scrubbing of what leaves for the provider. A hand-rolled version
# would have to re-solve check-digit-preserving substitution and stand-ins that
# arrive split across stream fragments; both are already tested there.
cred-swap-core = { git = "https://github.com/hexuria/cred-swap", branch = "main" }
subtle.workspace = true
hickory-resolver.workspace = true
argon2.workspace = true
opengrok-core = { path = "../opengrok-core" }
opengrok-box = { path = "../opengrok-box" }
opengrok-recipes = { path = "../opengrok-recipes" }
opengrok-tools = { path = "../opengrok-tools" }
opengrok-plugins = { path = "../opengrok-plugins" }
opengrok-wire = { path = "../opengrok-wire" }
opengrok-harness = { path = "../opengrok-harness" }
rmcp.workspace = true
opengrok-store = { path = "../opengrok-store" }
opengrok-policy = { path = "../opengrok-policy" }
jsonwebtoken.workspace = true
sha2.workspace = true
base64.workspace = true
reqwest.workspace = true
rand.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
# `net` + `io-util`: the screen proxy dials a box's loopback noVNC and splices the socket.
tokio = { workspace = true, features = ["net", "io-util", "process"] }
# The screen proxy's websocket: the upgraded connection, as tokio IO.
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
async-trait.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
# A PDF a person attaches reaches the model as its text (#229). Used only by the
# `opengrok-pdf-text` binary: the server never parses an untrusted PDF in its own process.
pdf-extract = "0.12"

# The PDF reader's own memory ceiling (`src/bin/opengrok-pdf-text.rs`): Linux enforces RLIMIT_AS.
[target.'cfg(target_os = "linux")'.dependencies]
rlimit = "0.11"
