[package]
name = "opengrok-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# ON BY DEFAULT so a deployment with OG_JEV_API_KEY keeps the live TypeSafe client. `dep:` so
# cargo does not invent a feature named typesafe-sdk. Off, the binary carries one reqwest and
# one hyper.
default = ["jev"]
jev = ["dep:typesafe-sdk"]

[dev-dependencies]
sqlx.workspace = true
base64.workspace = true
reqwest.workspace = true

[lints]
workspace = true

[dependencies]
# Reversible scrubbing of what leaves for the provider. A hand-rolled version
# would have to re-solve check-digit-preserving substitution and stand-ins that
# arrive split across stream fragments; both are already tested there.
cred-swap-core = { git = "https://github.com/hexuria/cred-swap", branch = "main" }
subtle.workspace = true
hickory-resolver.workspace = true
argon2.workspace = true
opengrok-core = { path = "../opengrok-core" }
opengrok-box = { path = "../opengrok-box" }
opengrok-recipes = { path = "../opengrok-recipes" }
opengrok-tools = { path = "../opengrok-tools" }
opengrok-plugins = { path = "../opengrok-plugins" }
opengrok-wire = { path = "../opengrok-wire" }
opengrok-harness = { path = "../opengrok-harness" }
rmcp.workspace = true
opengrok-store = { path = "../opengrok-store" }
opengrok-policy = { path = "../opengrok-policy" }
jsonwebtoken.workspace = true
sha2.workspace = true
base64.workspace = true
reqwest.workspace = true
rand.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
# `net` + `io-util`: the screen proxy dials a box's loopback noVNC and splices the socket.
tokio = { workspace = true, features = ["net", "io-util"] }
# The screen proxy's websocket: the upgraded connection, as tokio IO. Both are already in the
# tree under axum; named here because the splice needs their types.
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
async-trait.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
typesafe-sdk = { workspace = true, optional = true }
