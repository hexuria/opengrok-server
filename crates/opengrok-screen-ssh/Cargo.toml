[package]
name = "opengrok-screen-ssh"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
opengrok-box = { path = "../opengrok-box" }
async-trait.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tracing.workspace = true
getrandom = "0.2"
base64.workspace = true
serde_json.workspace = true
# The SSH server: one Bot's screen over a forward, and nothing else (#386).
russh = { version = "=0.63.3", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
