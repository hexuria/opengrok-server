[package]
name = "opengrok-box"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[dependencies]
opengrok-core = { path = "../opengrok-core" }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["io-util"] }
futures.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
grok-box.workspace = true
getrandom = "0.2"
# The box file route takes binary content as base64 (`write_file_bytes`); already the
# workspace's one base64 stack, so no second codec enters the tree.
base64.workspace = true
# The digest a placed bundle is remembered by (`bundle`).
sha2.workspace = true
