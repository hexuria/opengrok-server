[package]
name = "opengrok"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Forwards to opengrok-server; the binary's `mock-cards` door needs the catalogue that feature
# compiles in, and refuses to boot without it rather than falling back to a real (billed) door.
mock-fixtures = ["opengrok-server/mock-fixtures"]

[lints]
workspace = true

[[bin]]
name = "opengrok"
path = "src/main.rs"

[dependencies]
opengrok-server = { path = "../opengrok-server" }
opengrok-harness = { path = "../opengrok-harness" }
opengrok-box = { path = "../opengrok-box" }
opengrok-plugins = { path = "../opengrok-plugins" }
serde_json.workspace = true
opengrok-store = { path = "../opengrok-store" }
opengrok-core = { path = "../opengrok-core" }
uuid.workspace = true
tokio.workspace = true
axum.workspace = true
sqlx.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
chrono.workspace = true
