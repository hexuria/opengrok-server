[package]
name = "opengrok"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["jev"]
# Forwards Jev. Off, this binary has no typesafe-sdk and one HTTP stack.
jev = ["opengrok-server/jev"]
# Forwards to opengrok-server; the binary's `mock-cards` door needs the catalogue that feature
# compiles in, and refuses to boot without it rather than falling back to a real (billed) door.
mock-fixtures = ["opengrok-server/mock-fixtures"]

[lints]
workspace = true

[[bin]]
name = "opengrok"
path = "src/main.rs"

[dependencies]
opengrok-server = { path = "../opengrok-server", default-features = false }
opengrok-harness = { path = "../opengrok-harness" }
opengrok-box = { path = "../opengrok-box" }
opengrok-plugins = { path = "../opengrok-plugins" }
serde_json.workspace = true
opengrok-store = { path = "../opengrok-store" }
opengrok-core = { path = "../opengrok-core" }
uuid.workspace = true
tokio.workspace = true
axum.workspace = true
sqlx.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
chrono.workspace = true
# Only to pin the process-level TLS backend (see main.rs). reqwest asks rustls for aws-lc-rs and
# the grok-box SDK asks for ring; with both present rustls refuses to guess and panics on the
# first HTTPS call — inside a tokio task, which silently killed model turns.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
