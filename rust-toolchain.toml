# Pinned so local, CI, and the gateway repo all judge the code with the SAME compiler —
# open-ai-gateway's channel is `stable`, which was 1.99.0 when this pin was set. CI's previous
# `@stable` floated ahead of every developer machine, and a lint that fires only on the runner
# is a gate nobody can reproduce at their desk. Bumping this is a deliberate act that fixes
# whatever the new clippy finds in the same change.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
