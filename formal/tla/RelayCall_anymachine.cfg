\* EXPECTED TO FAIL: an answer taken from whichever machine posts first pipes another machine's words, the same person's or a stranger's under the same id, into a run that asked someone else.
\* VIOLATES: OnlyTheAsked
SPECIFICATION Spec
CONSTANTS Machines = {asked, sibling, stranger}  Asked = asked  MaxPosts = 1
          CheckMachine = FALSE  ForgetOnGiveUp = TRUE
INVARIANTS OnlyTheAsked
