\* EXPECTED TO FAIL, BY NATURE: a journal that refuses the ending cannot hold it. Kept as the
\* statement of what the loop cannot promise alone; the sweep is what ends such a run.
SPECIFICATION Spec
CONSTANTS MaxRounds = 3  MaxComputer = 4  SameLimit = 3  MaxFailedWork = 2
          JournalCanFail = TRUE  FallOutFails = TRUE  StopAtClose = TRUE
          OneWriteClose = TRUE  WriteBeforeEmit = TRUE
INVARIANTS EndingIsDurable
