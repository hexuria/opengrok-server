\* EXPECTED TO FAIL: a stream that read the switch on, then was registered after the switch-off's close had found nothing to close, is kept for a computer whose relay is off, and no close is coming for it.
\* VIOLATES: NoStreamWhileOff
SPECIFICATION Spec
CONSTANTS Machines = {mac}  Mine = {mac}  MaxPosts = 0
          MaxSwitches = 1  CheckMachine = TRUE  ForgetOnGiveUp = TRUE  SkipOff = TRUE  Recheck = FALSE
INVARIANTS NoStreamWhileOff
