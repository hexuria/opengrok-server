        - $ref: '#/components/parameters/BoxId'
      responses:
        '200':
          description: Interrupt requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxActionResponse' }
              examples:
                interrupted:
                  value:
                    ok: true
                    type: box.interrupted
                    id: bx_23456789
                    status: interrupted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /boxes/{boxId}/desktop:
    post:
      tags: [Box]
      summary: Get desktop streaming URL
      description: "Create or fetch a secret-bearing desktop/noVNC URL for live computer-use visibility. Use `?vnc=1` for noVNC; a `provisioning: true` response means poll again."
      operationId: desktop
      parameters:
        - $ref: '#/components/parameters/BoxId'
        - name: vnc
          in: query
          schema:
            type: integer
            enum: [1]
          description: Use VNC/noVNC streaming mode.
        - name: theme
          in: query
          schema:
            type: string
            enum: [light, dark]
          description: Desktop streaming theme for non-VNC mode.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesktopRequest' }
      responses:
        '200':
          description: Desktop streaming URL, or provisioning state for VNC setup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesktopResponse' }
              examples:
                ready:
                  value:
                    ok: true
                    type: desktop.url
                    success: true
                    desktopUrl: https://box-preview.example/vnc.html?_token=redacted
                    ip: 203.0.113.10
                    mode: vnc
                provisioning:
                  value:
                    ok: true
                    type: desktop.provisioning
                    provisioning: true
                    message: Preparing VNC desktop…
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /boxes/{boxId}/host:
    post:
      tags: [Box]
      summary: Expose a box port on a public HTTPS URL
      description: "Registers a stable `https://<box-subdomain>-<port>.on.ascii.dev` route for a port inside the Box and opens the Box firewall for it. Idempotent: calling it again for the same Box and port returns the same URL and token."
      operationId: hostPort
      parameters:
        - $ref: '#/components/parameters/BoxId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostPortRequest' }
      responses:
        '200':
          description: The public HTTPS URL for the port.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostPortResponse' }
              examples:
                hosted:
                  value:
                    ok: true
                    type: port.hosted
                    success: true
                    port: 3000
                    url: https://swift-otter-9021-3000.on.ascii.dev?_token=redacted
                    isProtected: true
                    access: private
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /boxes/{boxId}/sshkey:
    post:
      tags: [Box]
      summary: Configure box SSH key
      description: Adds an OpenSSH public key to the running Box so the caller can SSH as user `user`.
      operationId: sshKey
      parameters:
        - $ref: '#/components/parameters/BoxId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SshKeyRequest' }
      responses:
        '200':
          description: SSH key setup result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshKeyResponse' }
              examples:
                configured:
                  value:
                    ok: true
                    type: ssh_key.configured
                    success: true
                    machineIp: 203.0.113.10
                    sshUser: user
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /named-snapshots:
    get:
      tags: [Box]
      summary: List named snapshots
      description: List your named snapshots, newest first.
      operationId: listNamedSnapshots
      responses:
        '200':
          description: Named snapshots owned by the authenticated Box user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamedSnapshotListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Box]
      summary: Save a named snapshot
      description: >-
        Freeze a box's current state under a name (`box snapshot <id> <name>` in the CLI).
        Answers `202` immediately with the snapshot in `saving`; a running box takes a fresh
        capture first, which can run minutes. Poll `GET /named-snapshots/{name}` until the
        status settles at `ready` or `failed`. Reusing one of your existing names replaces
        that snapshot's artifact once the new save is ready.
      operationId: saveNamedSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedSnapshotSaveRequest' }
      responses:
        '202':
          description: Save accepted and running in the background.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamedSnapshotSavingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `named_snapshot_limit` when you already keep the maximum of 10 named snapshots;
            remove one first. `save_in_progress` when a save under this name is already
            running; wait for it to settle rather than retrying immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /named-snapshots/{name}:
    get:
      tags: [Box]
      summary: Get a named snapshot
      operationId: getNamedSnapshot
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The named snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamedSnapshotInfoResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Box]
      summary: Remove a named snapshot
      description: >-
        Remove a named snapshot and release its storage (`box snapshot rm <name>` in the
        CLI). Boxes already deployed from it are unaffected.
      operationId: deleteNamedSnapshot
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamedSnapshotDeletedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `save_in_progress`: a save under this name is still running. Wait for it to settle
            before removing it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /snapshots:
    get:
      tags: [Box]
      summary: List snapshots
      description: >-
        List visible completed snapshots across all of your boxes using immutable ownership attribution.
        Pinned, deletion-scheduled, and privacy-fenced Box snapshots are omitted. Follow `nextCursor`
        through the complete history; there is no hidden 500-snapshot cap.
      operationId: listSnapshots
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Completed snapshots owned by the authenticated Box user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotListResponse' }
              examples:
                snapshots:
                  value:
                    ok: true
                    type: snapshot.list
                    snapshots:
                      - id: 7417be09-d419-4ae0-b3fc-7f04a5a71ef1
                        boxId: bx_23456789
                        status: completed
                        kind: incremental
                        generation: 3
                        chainId: 4ced5b04-d2cb-4ec3-b127-3b3ed836cab5
                        createdAt: '2026-06-24T06:24:00Z'
                        completedAt: '2026-06-24T06:24:50Z'
                        sizeBytes: 18874368
                        fileCount: 6781
                    pageInfo:
                      nextCursor: null
                      hasMore: false
                      limit: 50
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /boxes/{boxId}/snapshots:
    get:
      tags: [Box]
      summary: List box snapshots
      description: List visible completed snapshots for one Box with uncapped cursor pagination.
      operationId: listBoxSnapshots
      parameters:
        - $ref: '#/components/parameters/BoxId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Completed snapshots for this box.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /boxes/{boxId}/snapshots/latest:
    get:
      tags: [Box]
      summary: Get latest box snapshot
      description: Return the most recent completed snapshot for this box, or `null` if it has none.
      operationId: getLatestBoxSnapshot
      parameters:
        - $ref: '#/components/parameters/BoxId'
      responses:
        '200':
          description: Most recent completed snapshot, or `null`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotLatestResponse' }
              examples:
                latest:
                  value:
                    ok: true
                    type: snapshot.latest
                    snapshot:
                      id: 7417be09-d419-4ae0-b3fc-7f04a5a71ef1
                      boxId: bx_23456789
                      status: completed
                      kind: incremental
                      generation: 3
                      chainId: 4ced5b04-d2cb-4ec3-b127-3b3ed836cab5
                      createdAt: '2026-06-24T06:24:00Z'
                      completedAt: '2026-06-24T06:24:50Z'
                      sizeBytes: 18874368
                      fileCount: 6781
                none:
                  value:
                    ok: true
                    type: snapshot.latest
                    snapshot: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /snapshots/{snapshotId}:
    delete:
      tags: [Box]
      summary: Permanently delete snapshot data
      description: >-
        Accept irreversible background deletion of an unpinned snapshot owned by the authenticated
        account. Snapshots required by another incremental snapshot or active restore return `409`.
        Poll the returned operation until `completed`.
      operationId: deleteSnapshot
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
        - $ref: '#/components/parameters/ConfirmDelete'
      responses:
        '202':
          description: Deletion confirmed and accepted for background processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionOperationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /snapshots/{snapshotId}/tree:
    get:
      tags: [Box]
      summary: Get snapshot file tree
      description: List the files and folders captured in a snapshot, with sizes. Returns a flat list of entries you can render as a tree.
      operationId: getSnapshotTree
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: Flat file/folder listing for the snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotTreeResponse' }
              examples:
                tree:
                  value:
                    ok: true
                    type: snapshot.tree
                    snapshotId: 7417be09-d419-4ae0-b3fc-7f04a5a71ef1
                    boxId: bx_23456789
                    generation: 3
                    treeAvailable: true
                    truncated: false
                    fileCount: 6781
                    totalSizeBytes: 458291
                    entries:
                      - { path: src, kind: dir }
                      - { path: src/main.ts, kind: file, size: 1024 }
                legacy:
                  value:
                    ok: true
                    type: snapshot.tree
                    snapshotId: 7417be09-d419-4ae0-b3fc-7f04a5a71ef1
                    boxId: bx_23456789
                    generation: 0
                    treeAvailable: false
                    truncated: false
                    fileCount: 0
                    totalSizeBytes: 0
                    entries: []
                    reason: legacy_snapshot
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /snapshots/{snapshotId}/files:
    get:
      tags: [Box]
      summary: Download a file or folder from a snapshot
      description: >-
        Stream a single file's bytes, or a folder subtree as a tar archive, directly
        out of a snapshot, the box can be stopped or archived; the machine is never
        contacted. Use `GET /snapshots/{snapshotId}/tree` to list paths, then pass one
        here. Paths are relative to the snapshot root (same space as `tree` entries;
        docker volumes under `__dockervol__/`). An empty or `/` path downloads the whole
        snapshot as a tar. Folder responses set `X-Snapshot-File-Count`,
        `X-Snapshot-Total-Size-Bytes` and `X-Snapshot-Skipped-Base-Image-Files` headers;
        both response shapes set `X-Snapshot-Entry-Kind` (`file` or `dir`).
      operationId: getSnapshotFile
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
        - name: path
          in: query
          required: false
          schema: { type: string }
          description: File or folder path inside the snapshot. Empty for the whole snapshot.
      responses:
        '200':
          description: File bytes (`application/octet-stream`) or folder tar (`application/x-tar`).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/x-tar:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Path has no downloadable bytes, one of `legacy_snapshot` (pre-inventory snapshot), `snapshot_not_indexed` (content captured before the indexed snapshot format; take a new snapshot or use the download bundle), `base_image_file` (stock image file, not stored in snapshots), or `is_symlink` (request the symlink's target instead).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /snapshots/{snapshotId}/download:
    get:
      tags: [Box]
      summary: Get snapshot download
      description: |
        Return time-limited signed URLs for every chunk needed to reconstruct the box filesystem at this snapshot (the full chain, base through this generation), plus the inventory. Download the chunks and reassemble them as described by `reconstruct`. The `box snapshot pull` CLI command does this for you.
      operationId: getSnapshotDownload
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: Signed chunk URLs for the snapshot chain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotDownloadResponse' }
              examples:
                download:
                  value:
                    ok: true
                    type: snapshot.download
                    snapshotId: 7417be09-d419-4ae0-b3fc-7f04a5a71ef1
                    boxId: bx_23456789
                    kind: incremental
                    generation: 3
                    expiresInSeconds: 3600
                    reconstruct: Download every chunk. For each snapshot in ascending generation, concat its chunks by chunkIndex and pipe through `zstd -d | tar -x`.
                    inventory:
                      r2Key: chains/4ced5b04/inventory-3.json.zst
                      signedUrl: https://r2.example/chains/4ced5b04/inventory-3.json.zst?sig=redacted
                    chunks:
                      - snapshotId: 2db50582-716c-424c-817e-9495484f88dd
                        generation: 0
                        chunkIndex: 0
                        r2Key: chains/4ced5b04/snapshots/2db50582/chunks/00.tar.zst
                        sizeBytes: 209715200
                        sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                        signedUrl: https://r2.example/chains/4ced5b04/snapshots/2db50582/chunks/00.tar.zst?sig=redacted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
