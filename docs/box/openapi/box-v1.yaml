    WebhookDeleteResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [id]
          properties:
            id:
              type: string
    SnapshotSummary:
      type: object
      required: [id, boxId, status, generation, createdAt, sizeBytes, fileCount]
      properties:
        id:
          type: string
          format: uuid
        boxId:
          type: string
          description: Public Box id this snapshot belongs to.
        status:
          type: string
          enum: [completed]
        kind:
          type: [string, 'null']
          enum: [base, incremental, null]
          description: '`base` (full) or `incremental` (delta on a base). `null` for legacy snapshots.'
        generation:
          type: integer
          description: Position in the incremental chain (0 = base).
        chainId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        sizeBytes:
          type: integer
          description: Bytes this snapshot added (its delta), not the full restored size.
        fileCount:
          type: integer
          description: Inventory entries alive in the chain at this generation (includes base-image system entries).
        contentSizeBytes:
          type: [integer, 'null']
          description: Total bytes of your data restored by this snapshot (what resume/download returns; base image excluded). `null` on legacy snapshots.
        contentFileCount:
          type: [integer, 'null']
          description: Number of your files restored by this snapshot (base image excluded). `null` on legacy snapshots.
    SnapshotListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [snapshots]
          properties:
            type:
              type: string
              const: snapshot.list
            snapshots:
              type: array
              items:
                $ref: '#/components/schemas/SnapshotSummary'
            pageInfo:
              $ref: '#/components/schemas/PageInfo'
    SnapshotLatestResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [snapshot]
          properties:
            type:
              type: string
              const: snapshot.latest
            snapshot:
              oneOf:
                - $ref: '#/components/schemas/SnapshotSummary'
                - type: 'null'
    NamedSnapshot:
      type: object
      description: >-
        A named snapshot: a frozen copy of a box's disk at one moment, saved under a
        name you pick. Independent of the source box's later life — the box can change,
        stop, or be deleted and the named snapshot still deploys. Named snapshots never
        expire; re-saving a name replaces its artifact.
      required: [name, status, sourceBoxId, createdAt]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
          description: The user-chosen handle, unique within your account.
        status:
          type: string
          enum: [saving, ready, failed]
          description: >-
            `saving` while the capture and pin are in flight (a live source box takes a
            fresh snapshot first, which can run minutes), `ready` when deployable,
            `failed` if the save did not complete (see `error`; save again to retry).
        error:
          type: string
          description: Failure reason. Only present when `status` is `failed`.
        sourceBoxId:
          type: string
          description: The box this snapshot was saved from (display only).
        snapshotId:
          type: string
          description: >-
            The frozen artifact behind the name. Present once `status` is `ready`.
            Accepted by `GET /api/box/snapshots/{snapshotId}/tree` to browse its files.
        type:
          type: string
          description: Box type the snapshot was saved from. Deploys default to it.
        sizeBytes:
          type: integer
          description: Restored content size of the frozen state, in bytes.
        createdAt:
          type: string
          format: date-time
    NamedSnapshotListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [snapshots]
          properties:
            type:
              type: string
              const: snapshot.named.list
            snapshots:
              type: array
              items:
                $ref: '#/components/schemas/NamedSnapshot'
    NamedSnapshotInfoResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [snapshot]
          properties:
            type:
              type: string
              const: snapshot.named.info
            snapshot:
              $ref: '#/components/schemas/NamedSnapshot'
    NamedSnapshotSaveRequest:
      type: object
      required: [boxId, name]
      properties:
        boxId:
          type: string
          description: The box whose current state to freeze.
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
          description: >-
            Name to save under. 1-63 lowercase letters, digits, or dashes, starting with
            a letter or digit. Reusing one of your existing names replaces that snapshot's
            artifact. `latest`, `tree`, `pull`, `rm`, `save`, `current`, `self`, and `new`
            are reserved.
    NamedSnapshotSavingResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [status, snapshot]
          properties:
            type:
              type: string
              const: snapshot.named.saving
            status:
              type: string
              const: saving
            snapshot:
              $ref: '#/components/schemas/NamedSnapshot'
    NamedSnapshotDeletedResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [name, status]
          properties:
            type:
              type: string
              const: snapshot.named.deleted
            name:
              type: string
            status:
              type: string
              const: deleted
    SnapshotTreeEntry:
      type: object
      required: [path, kind]
      properties:
        path:
          type: string
          description: Path relative to the snapshot root. Docker named volumes appear under `__dockervol__/`.
        kind:
          type: string
          enum: [file, dir, symlink]
        size:
          type: integer
          description: File size in bytes. Omitted for directories.
    SnapshotTreeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [snapshotId, boxId, generation, treeAvailable, truncated, fileCount, totalSizeBytes, entries]
          properties:
            type:
              type: string
              const: snapshot.tree
            snapshotId:
              type: string
              format: uuid
            boxId:
              type: string
            generation:
              type: integer
            treeAvailable:
              type: boolean
              description: '`false` for legacy snapshots or inventories too large to expand; see `reason`.'
            truncated:
              type: boolean
              description: '`true` when the file list was capped; not every entry is returned.'
            fileCount:
              type: integer
              description: Number of your files in this snapshot (base-image system files excluded).
            totalSizeBytes:
              type: integer
              description: Total bytes of your data in this snapshot (base-image system files excluded).
            entries:
              type: array
              description: Exactly the files/dirs a resume or download returns, your data only; base-image system entries are not listed.
              items:
                $ref: '#/components/schemas/SnapshotTreeEntry'
            reason:
              type: string
              description: Why the tree is unavailable, when `treeAvailable` is `false`.
              examples: [legacy_snapshot, inventory_too_large]
    SnapshotChunk:
      type: object
      required: [snapshotId, generation, chunkIndex, r2Key, sizeBytes, sha256, signedUrl]
      properties:
        snapshotId:
          type: string
          format: uuid
        generation:
          type: integer
        chunkIndex:
          type: integer
        r2Key:
          type: string
        sizeBytes:
          type: integer
        sha256:
          type: string
        signedUrl:
          type: string
          format: uri
          description: Time-limited download URL (see `expiresInSeconds`).
    SnapshotDownloadResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [snapshotId, boxId, kind, generation, expiresInSeconds, reconstruct, chunks]
          properties:
            type:
              type: string
              const: snapshot.download
            snapshotId:
              type: string
              format: uuid
            boxId:
              type: string
            kind:
              type: string
              enum: [base, incremental, legacy]
            generation:
              type: integer
            expiresInSeconds:
              type: integer
              description: Lifetime of every `signedUrl` in this response.
            reconstruct:
              type: string
              description: Human-readable note on how to reassemble the chunks into a filesystem.
            inventory:
              oneOf:
                - type: object
                  required: [r2Key, signedUrl]
                  properties:
                    r2Key: { type: string }
                    signedUrl: { type: string, format: uri }
                - type: 'null'
            chunks:
              type: array
              description: Every chunk across the chain (all generations up to and including this snapshot), ordered by `(generation, chunkIndex)`.
              items:
                $ref: '#/components/schemas/SnapshotChunk'
    DeletionOperation:
      type: object
      required: [id, kind, targetId, reason, status, attemptCount, requestedAt, completedAt]
      properties:
        id:
          type: string
          pattern: '^bdop_[a-f0-9]{32}$'
        kind:
          type: string
          enum: [box, snapshot]
        targetId:
          type: string
        reason:
          type: string
          enum: [explicit, zdr, account]
        status:
          type: string
          enum: [pending, processing, blocked, completed]
        attemptCount:
          type: integer
          minimum: 0
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    DeletionOperationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [operation]
          properties:
            type:
              type: string
              enum: [deletion.operation, box.deleting, snapshot.deleting]
            operation:
              $ref: '#/components/schemas/DeletionOperation'
    DataRetentionPolicyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [enabled, enabledAt]
          properties:
            type:
              type: string
              enum: [data_retention.info, data_retention.updated]
            enabled:
              type: boolean
            enabledAt:
              type: [string, 'null']
              format: date-time
            queuedBoxes:
              type: integer
              minimum: 0
              description: Archived Boxes newly queued for deletion by this policy update.
            acceptedDeletionOperationsIrreversible:
              type: boolean
              description: Always true on updates. Disabling the policy does not cancel accepted deletion operations.
    DataRetentionUpdateRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        confirmation:
          type: string
          description: Required when enabling and must exactly equal `delete archived box data`.
          const: delete archived box data
  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalid:
              value:
                ok: false
                type: box.error
                status: 400
                code: invalid_json
                message: Request body must be valid JSON.
                error: { code: invalid_json, message: Request body must be valid JSON., status: 400 }
                requestId: req_01HX...
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unauthorized:
              value:
                ok: false
                type: box.error
                status: 401
                code: unauthorized
                message: Unauthorized
                error: { code: unauthorized, message: Unauthorized, status: 401 }
                requestId: req_01HX...
    Forbidden:
      description: Authenticated token is not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            forbidden:
              value:
                ok: false
                type: box.error
                status: 403
                code: forbidden
                message: Forbidden
                error: { code: forbidden, message: Forbidden, status: 403 }
                requestId: req_01HX...
    PaymentRequired:
      description: Account cannot currently create or operate Boxes. The error body may include a dashboard billing URL, but billing actions are not part of the v1 API.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Request conflicts with current account or box state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: >-
        Machine start or concurrent-box limit reached. Create, fork and resume each count as one
        machine start against your plan's per-minute rate, five times that per hour and three
        times the hourly rate per day (`rate_limited`, naming the window you hit). A box that
        would exceed your plan's concurrent-box cap is refused with `limit_reached`, or
        `member_limit_reached` when an organization owner has capped you below the plan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
paths:
  /me:
    get:
      tags: [Box]
      summary: Get current Box user
      description: Returns GitHub identity for the authenticated Box account.
      operationId: me
      responses:
        '200':
          description: Current user information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
              examples:
                user:
                  value:
                    ok: true
                    type: user.info
                    user:
                      login: octocat
                      email: octocat@example.com
                      zeroDataRetention: false
                      zeroDataRetentionEnabledAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
  /account/data-retention:
    get:
      tags: [Box]
      summary: Get account data-retention policy
      description: Returns the current zero-data-retention policy. Per-Box API keys cannot access this account-wide setting. Responses are never cached.
      operationId: getDataRetention
      responses:
        '200':
          description: Current retention policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataRetentionPolicyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Box]
      summary: Update account data-retention policy
      description: >-
        Requires an interactive Box session; API keys and legacy permanent tokens are refused.
        Enabling requires the exact confirmation phrase `delete archived box data`. Disabling
        affects future archives only and cannot cancel deletion operations already accepted.
      operationId: updateDataRetention
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataRetentionUpdateRequest' }
      responses:
        '200':
          description: Updated retention policy. Responses are never cached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataRetentionPolicyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deletion-operations/{operationId}:
    get:
      tags: [Box]
      summary: Get deletion operation
      description: Poll an accepted Box or snapshot deletion. Only operations owned by the authenticated account are returned. Responses are never cached.
      operationId: getDeletionOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Current deletion operation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionOperationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /limits:
    get:
      tags: [Box]
      summary: Get Box limits
      description: Check remaining machine starts, compute time, credits, access readiness, and concurrent-box capacity for the authenticated account. Pass `org` / `X-Box-Org` (or `teamId`) to read a team wallet you belong to.
      operationId: limits
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/OrgHeader'
        - name: teamId
          in: query
          required: false
          schema: { type: string }
          description: Legacy alias for `org`. Takes precedence over `org` / `X-Box-Org` when set.
      responses:
        '200':
          description: Current creation and concurrent-box limits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LimitsResponse' }
              examples:
                ready:
                  value:
                    ok: true
                    type: limits.info
                    canStart: true
                    activeBoxes: 1
                    activeStates: [provisioned, cloning, ready, idle, running]
                    boxPlanKey: box_20
                    boxPlanDollars: 20
                    maxActiveBoxes: 100
                    maxCreationRequestsPerMinute: 10
                    maxCreationRequestsPerDay: null
                    startLimits: { perMinute: 10, perHour: 50, perDay: 150 }
                    starts:
                      unlimited: false
                      minute: { limit: 10, used: 3, remaining: 7 }
                      hour: { limit: 50, used: 12, remaining: 38 }
                      day: { limit: 150, used: 47, remaining: 103 }
                    billingStatus: active
                    creditBalanceSeconds: 7200
                    creditBalanceHours: 2
                    packBalanceSeconds: 500000
                    packBalanceHours: 138.89
                    packBalanceDollars: 5
        '401': { $ref: '#/components/responses/Unauthorized' }
  /repos:
    get:
      tags: [Box]
      summary: List GitHub repositories available to Box
      description: Returns GitHub repositories grouped by installation plus the current selected repositories for new Boxes.
      operationId: repos
      parameters:
        - name: sync
          in: query
          schema: { type: boolean }
          description: When true, sync from GitHub before returning repository groups.
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive repository name/fullName filter.
        - name: selected
          in: query
          schema: { type: boolean }
          description: Filter to selected or unselected repositories.
      responses:
        '200':
          description: Repository groups and current Box repository selection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReposResponse' }
              examples:
                repos:
                  value:
                    ok: true
                    type: repos.list
                    environmentId: env_123
                    installations:
                      - type: Organization
                        accountLogin: acme
                        accountAvatarUrl: https://github.com/acme.png
                        repositories:
                          - id: 123456
                            databaseId: repo_org_123456
                            name: web
                            fullName: acme/web
                            description: Marketing site
                            url: https://github.com/acme/web
                            private: true
                            permissions: admin
                            pushedAt: '2026-05-31T12:00:00Z'
                    selectedRepositories:
                      - id: 123456
                        databaseId: repo_org_123456
                        name: web
                        fullName: acme/web
                        private: true
                        permissions: admin
                        pushedAt: '2026-05-31T12:00:00Z'
                        baseBranch: dev
                        setupRoutineId: null
                        setupScript: ''
                        setupBlocking: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    post:
      tags: [Box]
      summary: Select repository for Boxes
      description: Idempotently selects one repository for the Box environment. Use `databaseId` from `GET /repos` as `repositoryId`; selecting an already-selected repository updates its `baseBranch`.
      operationId: selectRepo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepoSelectionRequest' }
      responses:
        '200':
          description: Updated repository selection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoSelectionResponse' }
              examples:
                selected:
                  value:
                    ok: true
                    type: repos.updated
                    success: true
                    environmentId: env_123
                    selectedRepositories:
                      - databaseId: repo_org_123456
                        name: web
                        fullName: acme/web
                        baseBranch: dev
                        setupRoutineId: null
                        setupScript: ''
                        setupBlocking: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api-keys:
    get:
      tags: [Box]
      summary: List API keys
      description: Lists API key metadata only. Raw key secrets are not returned after creation/rotation. Results are scoped to the authenticated Box account.
      operationId: apiKeys
      responses:
        '200':
          description: API key metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeysResponse' }
              examples:
                keys:
                  value:
                    ok: true
                    type: api_key.list
                    apiKeys:
                      - id: sak_123
                        name: Production worker
                        keyPrefix: box_live
                        keyLastFour: 9abc
                        sandboxId: null
                        createdAt: '2026-05-31T12:00:00Z'
                        lastUsedAt: null
                        usage:
                          requests: 1842
                          windowDays: 30
                        resources:
                          total: 3
                          boxes: 2
                          agents: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api-keys/{apiKeyId}/usage:
    parameters:
      - name: apiKeyId
        in: path
        required: true
        description: API key ID returned by `GET /api-keys`.
        schema: { type: string }
    get:
      tags: [Box]
      summary: Get API key usage
      description: Returns the key's request total for the 30-day UTC window and the Boxes and Agents it created that still exist, including Boxes that never got a Sandbox row. Works for revoked keys owned by the authenticated account.
      operationId: apiKeyUsage
      responses:
        '200':
          description: Usage and created resources for the key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyUsageResponse' }
              examples:
                usage:
                  value:
                    ok: true
                    type: api_key.usage
                    id: sak_123
                    name: Production worker
                    keyPrefix: box_live
                    keyLastFour: 9abc
                    sandboxId: null
                    createdAt: '2026-05-31T12:00:00Z'
                    lastUsedAt: '2026-08-25T09:30:00Z'
                    usage:
                      requests: 1842
                      windowDays: 30
                    resources:
                      total: 2
                      boxes: 1
                      agents: 1
                    createdResources:
                      - kind: box
                        id: bx_123
                        name: CI build
                        state: ready
                        createdAt: '2026-08-24T14:00:00Z'
                      - kind: agent
                        id: agent_456
                        name: Review
                        state: idle
                        createdAt: '2026-08-23T12:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks:
    get:
      tags: [Box]
      summary: List webhooks
      description: Lists account-wide Box lifecycle webhook endpoints. Signing secrets are never included.
      operationId: listWebhooks
      responses:
        '200':
          description: Registered webhook endpoints.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Box]
      summary: Create webhook
      description: |
        Registers an account-wide endpoint for Box lifecycle events. The endpoint must use HTTPS on port 443 and resolve only to public addresses. Redirects are not followed during delivery.

        The signing secret is returned only in this response. An account can register at most 10 unique endpoint URLs.
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreateRequest' }
            examples:
              readyAndError:
                value:
                  name: Production automation
                  url: https://example.com/hooks/box
                  events: [box.ready, box.error]
      responses:
        '201':
          description: Webhook created. Store the one-time signing secret now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSecretResponse' }
              examples:
                created:
                  value:
                    ok: true
                    type: webhook.created
                    webhook:
                      id: wh_0123456789abcdef01234567
                      name: Production automation
                      url: https://example.com/hooks/box
                      events: [box.ready, box.error]
                      createdAt: '2026-08-11T12:00:00Z'
                      updatedAt: '2026-08-11T12:00:00Z'
                    secret: whsec_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /webhooks/{webhookId}:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          pattern: '^wh_[a-f0-9]{24}$'
    get:
      tags: [Box]
      summary: Get webhook
      description: Returns webhook metadata without the signing secret.
      operationId: getWebhook
      responses:
        '200':
          description: Webhook metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Box]
      summary: Update webhook
      description: Updates the name, endpoint URL, or subscribed events without changing the signing secret.
      operationId: updateWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookUpdateRequest' }
      responses:
        '200':
          description: Updated webhook metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Box]
      summary: Delete webhook
      description: Deletes the endpoint and its queued deliveries. An attempt already in flight can still arrive.
      operationId: deleteWebhook
      responses:
        '200':
          description: Webhook deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeleteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks/{webhookId}/rotate:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          pattern: '^wh_[a-f0-9]{24}$'
    post:
      tags: [Box]
      summary: Rotate webhook signing secret
      description: Replaces the endpoint's signing secret. The new secret is returned only in this response; briefly accept the old secret for attempts already in flight.
      operationId: rotateWebhookSigningSecret
      responses:
        '200':
          description: Signing secret rotated. Store the new secret now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSecretResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /secrets:
    get:
      tags: [Box]
      summary: Get Box secrets setup
      description: Returns the environment variables and secret files configured for Boxes.
      operationId: secrets
      responses:
        '200':
          description: Current secret setup metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretsResponse' }
              examples:
                secrets:
                  value:
                    ok: true
                    type: secrets.info
                    environmentId: env_123
                    envContents: "OPENAI_API_KEY=sk-...\n"
                    secretFiles:
                      - path: .config/service-account.json
                        contents: '{"type":"service_account"}'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Box]
      summary: Update Box secrets setup
      operationId: updateSecrets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretsUpdateRequest' }
      responses:
        '200':
          description: Updated secret setup metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretsResponse' }
              examples:
                updated:
                  value:
                    ok: true
                    type: secrets.updated
                    success: true
                    environmentId: env_123
                    envContents: "OPENAI_API_KEY=sk-...\n"
                    secretFiles: []
                    pushed: { updated: 2, failed: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /environments:
    get:
      tags: [Box]
      summary: List Box environments
      description: Returns every non-deleted Box environment with its latest-version flags, contents, and per-version box usage. A default environment named `base` is created on first access if none exists.
      operationId: environments
      responses:
        '200':
          description: The account's Box environments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxEnvironmentListResponse' }
              examples:
                environments:
                  value:
                    environments:
                      - id: 8f1c2d3e-0000-4000-8000-000000000001
                        name: default
                        isDefault: true
                        latestVersionId: 8f1c2d3e-0000-4000-8000-0000000000a1
                        safeForThirdParties: false
                        passGithub: true
                        passSecrets: true
                        passBoxCredentials: true
                        passAgentsCredentials: true
                        envContents: "OPENAI_API_KEY=sk-...\n"
                        secretFiles: []
                        versions:
                          - id: 8f1c2d3e-0000-4000-8000-0000000000a1
                            versionNumber: 1
                            boxCount: 3
                            createdAt: '2026-06-01T12:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Box]
      summary: Create a Box environment
      description: Create a new named environment. It starts on version 1 with all fine-grained flags on and `safeForThirdParties` off.
      operationId: createEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBoxEnvironmentRequest' }
      responses:
        '200':
          description: Environment created; full list returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxEnvironmentListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{environmentId}:
    parameters:
      - name: environmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Environment id returned by `GET /environments`.
    put:
      tags: [Box]
      summary: Update a Box environment
      description: Rename, set as default, and/or edit flags and contents. Any flag or content change mints a new immutable version; existing boxes stay on their pinned version until you call upgrade.
      operationId: updateEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBoxEnvironmentRequest' }
      responses:
        '200':
          description: Updated environment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxEnvironmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Box]
      summary: Delete a Box environment
      description: Soft-deletes an environment. The default environment cannot be deleted, and at least one environment is always kept.
      operationId: deleteEnvironment
      responses:
        '200':
          description: Environment soft-deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxEnvironmentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{environmentId}/upgrade:
    post:
      tags: [Box]
      summary: Upgrade boxes to an environment's latest version
      description: Repoints the caller's active boxes from an older version of this environment to its latest version, scrubbing any owner secrets the new version drops and hot-pushing the new config.
      operationId: upgradeEnvironment
      parameters:
        - name: environmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpgradeBoxEnvironmentRequest' }
      responses:
        '200':
          description: Upgrade result counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpgradeBoxEnvironmentResponse' }
              examples:
                upgraded:
                  value:
                    success: true
                    upgraded: 2
                    failed: 0
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /environments/{environmentId}/vars/{key}:
    parameters:
      - name: environmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: key
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$' }
        description: Environment variable name.
    put:
      tags: [Box]
      summary: Set one environment variable
      description: Sets or replaces a single variable without reading or rewriting the rest. Mints a new immutable version.
      operationId: setEnvironmentVar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        '200':
          description: New version minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentItemChangeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Box]
      summary: Remove one environment variable
      description: Removes a single variable. Mints a new immutable version.
      operationId: deleteEnvironmentVar
      responses:
        '200':
          description: New version minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentItemChangeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /environments/{environmentId}/secret-files:
    parameters:
      - name: environmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Box]
      summary: Write one secret file
      description: Adds or replaces a single secret file by path. Mints a new immutable version.
      operationId: setEnvironmentSecretFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, contents]
              properties:
                path:
                  type: string
                  description: In-box path relative to the workspace, e.g. `.env` or `repo/.env`.
                contents: { type: string }
      responses:
        '200':
          description: New version minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentItemChangeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Box]
      summary: Remove one secret file
      description: Removes the secret file at `path`. Mints a new immutable version.
      operationId: deleteEnvironmentSecretFile
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: New version minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentItemChangeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /environments/{environmentId}/repos:
    post:
      tags: [Box]
      summary: Add a repository to an environment
      description: Adds a repository (or updates its base branch) by database id from the repository list. Mints a new immutable version.
      operationId: addEnvironmentRepo
      parameters:
        - name: environmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repositoryId]
              properties:
                repositoryId:
                  type: string
                  description: The repository `databaseId` from `GET /repos`.
                baseBranch:
                  type: string
                  default: main
      responses:
        '200':
          description: New version minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentItemChangeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /environments/{environmentId}/repos/{repositoryId}:
    delete:
      tags: [Box]
      summary: Remove a repository from an environment
      description: Removes one repository from the environment's selection. Mints a new immutable version.
      operationId: deleteEnvironmentRepo
      parameters:
        - name: environmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: repositoryId
          in: path
          required: true
          schema: { type: string }
          description: The repository `databaseId`.
      responses:
        '200':
          description: New version minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentItemChangeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /boxes:
    get:
      tags: [Box]
      summary: List boxes
      operationId: boxes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: state
          in: query
          schema: { type: string }
          description: Comma-separated Box state filter, for example `ready,idle,running`.
      responses:
        '200':
          description: Boxes owned by the authenticated Box user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxListResponse' }
              examples:
                boxes:
                  value:
                    ok: true
                    type: box.list
                    boxes:
                      - id: bx_23456789
                        name: Box 2026-05-31 12:00
                        state: idle
                        url: https://machine.on.ascii.dev
                        ip: 203.0.113.10
                        createdAt: '2026-05-31T12:00:00Z'
                        updatedAt: '2026-05-31T12:05:00Z'
                        archiveAfter: '2026-05-31T13:00:00Z'
                        desktopAvailable: true
                        desktopUrl: https://desktop.example/stream.html?token=redacted
                        snapshotAvailable: false
                        snapshotCompletedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Box]
      summary: Create box
      description: >-
        Provision a new cloud computer. Store the returned `box.id` with your product job/session
        record. Send an `Idempotency-Key` header to make this call safe to retry after a lost
        response without creating a second billable box.
      operationId: create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBoxRequest' }
      responses:
        '202':
          description: Box accepted for provisioning.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateBoxResponse' }
              examples:
                provisioning:
                  value:
                    ok: true
                    type: box.created
                    status: provisioning
                    ttlSeconds: 3600
                    box:
                      id: bx_23456789
                      name: Box 2026-05-31 12:00
                      state: provisioning
                      url: null
                      ip: null
                      createdAt: '2026-05-31T12:00:00Z'
                      updatedAt: '2026-05-31T12:00:00Z'
                      archiveAfter: '2026-05-31T13:00:00Z'
                      desktopAvailable: false
                      desktopUrl: null
                      snapshotAvailable: false
                      snapshotCompletedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /boxes/{boxId}:
    parameters:
      - $ref: '#/components/parameters/BoxId'
    get:
      tags: [Box]
      summary: Get box
      description: Poll this endpoint after create, stop, resume, or fork operations.
      operationId: get
      responses:
        '200':
          description: Box details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxInfoResponse' }
              examples:
                box:
                  value:
                    ok: true
                    type: box.info
                    box:
                      id: bx_23456789
                      name: Box 2026-05-31 12:00
                      state: idle
                      url: https://machine.on.ascii.dev
                      ip: 203.0.113.10
                      createdAt: '2026-05-31T12:00:00Z'
                      updatedAt: '2026-05-31T12:05:00Z'
                      archiveAfter: '2026-05-31T13:00:00Z'
                      desktopAvailable: true
                      desktopUrl: https://desktop.example/stream.html?token=redacted
                      snapshotAvailable: false
                      snapshotCompletedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Box]
      summary: Update box
      operationId: update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBoxRequest' }
      responses:
        '200':
          description: Updated box details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxInfoResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Box]
      summary: Permanently delete Box data
      description: >-
        Accept irreversible background deletion of the Box machine, snapshots, and content-bearing
        records. This is not archive: the Box cannot be resumed. Named snapshots and other shared
        artifacts remain independent. Poll the returned operation until `completed`.
      operationId: deleteBox
      parameters:
        - $ref: '#/components/parameters/ConfirmDelete'
      responses:
        '202':
          description: Deletion confirmed and accepted for background processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionOperationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /boxes/{boxId}/stop:
    post:
      tags: [Box]
      summary: Stop and archive box
      description: |
        Stop active work and archive/snapshot the box for later resume or fork.

        A stop always saves the box's disk first. If that save is failing, the stop is
        refused and the box keeps running so your work is not discarded, we retry
        automatically and email you. You are not billed for time spent in that state.

        Set `force: true` to stop anyway, accepting the loss of everything written since
        the last successful snapshot. This is irreversible; only reach for it after a
        stop has already failed.
      operationId: stop
      parameters:
        - $ref: '#/components/parameters/BoxId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopRequest' }
      responses:
        '202':
          description: Box archival started or already in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxActionResponse' }
              examples:
                archiving:
                  value:
                    ok: true
                    type: box.stopping
                    id: bx_23456789
                    status: archiving
                    box: { id: bx_23456789, name: Box 2026-05-31 12:00, state: archiving, desktopAvailable: true, snapshotAvailable: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /boxes/{boxId}/resume:
    post:
      tags: [Box]
      summary: Resume box
      operationId: resume
      parameters:
        - $ref: '#/components/parameters/BoxId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeRequest' }
      responses:
        '202':
          description: Resume started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxActionResponse' }
              examples:
                resuming:
                  value:
                    ok: true
                    type: box.resuming
                    id: bx_23456789
                    status: resuming
                    box: { id: bx_23456789, name: Box 2026-05-31 12:00, state: provisioning, desktopAvailable: false, snapshotAvailable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /boxes/{boxId}/fork:
    post:
      tags: [Box]
      summary: Fork box
      description: >-
        Provision a new box from an existing one. Send an `Idempotency-Key` header to make this
        call safe to retry after a lost response without creating a second billable fork.
      operationId: fork
      parameters:
        - $ref: '#/components/parameters/BoxId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                env:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Replaces the env the fork would otherwise inherit from the source box.
                    Same validation rules as `CreateBoxRequest.env`.
                environment:
                  type: string
                  description: >-
                    Optionally pin the fork to a different named Box environment. Omit to inherit
                    the source box's environment. Unknown names are rejected with
                    `unknown_environment`.
                  examples: [base, customer-demos]
                noEnv:
                  type: boolean
                  description: >-
                    Make the fork no-env (see `CreateBoxRequest.noEnv`). A fork of a no-env box is
                    always no-env regardless of this field.
                type:
                  type: string
                  enum: [small, default, large]
                  description: >-
                    Machine size for the fork. Omit to inherit the source box's type. The source
                    box is never modified. Shrinking is rejected with `type_too_small` when the
                    source's data would not fit the smaller disk.
                ttlSeconds:
                  oneOf:
                    - type: integer
                      minimum: 1
                      maximum: 2592000
                    - type: 'null'
                  default: 3600
                  description: >-
                    Auto-stop for the fork, in seconds. Omit for the 1 hour default; the fork
                    does NOT inherit the source box's TTL, so forking a Box that has auto-stop
                    disabled still gives you a fork that stops itself. `null` disables
                    auto-stop, which means nothing will ever stop this Box for you.
      responses:
        '202':
          description: Fork started. The response `id` is the new forked box id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxActionResponse' }
              examples:
                forking:
                  value:
                    ok: true
                    type: box.forking
                    id: bx_abcdef23
                    status: forking
                    box: { id: bx_abcdef23, name: Box fork, state: provisioning, desktopAvailable: false, snapshotAvailable: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /boxes/{boxId}/prompt:
    post:
      tags: [Box]
      summary: Prompt Box
      description: Queue a natural-language work item for Codex or Claude Code inside the box. Observe progress with `GET /boxes/{boxId}/events`.
      operationId: prompt
      parameters:
        - $ref: '#/components/parameters/BoxId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromptRequest' }
            examples:
              repoWork:
                value:
                  provider: codex
                  model: gpt-5.4
                  reasoningEffort: medium
                  prompt: Work on the selected repo, run tests, fix failures, commit the result, and report any hosted preview URL.
              computerUse:
                value:
                  provider: claude-code
                  model: sonnet
                  reasoningEffort: high
                  prompt: Use the browser to research flight options to France and return the best itinerary summary with source links.
      responses:
        '202':
          description: Prompt queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptResponse' }
              examples:
                queued:
                  value:
                    ok: true
                    type: prompt.queued
                    id: bx_23456789
                    promptId: prompt_123
                    promptRun:
                      id: prompt_123
                      promptId: prompt_123
                      boxId: bx_23456789
                      status: queued
                      done: false
                    status: queued
                    provider: codex
                    model: gpt-5.4
                    reasoningEffort: medium
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /boxes/{boxId}/events:
    get:
      tags: [Box]
      summary: List box events
      description: Return Box work, lifecycle, and progress events so product UIs can show what the box is doing. Event payloads are extensible. Clients can long-poll this endpoint with `sort=asc` and a cursor to stream responses. Response events expose agent text, streaming partials via `data.is_streaming`, and tool calls/results via `data.tools`.
      operationId: events
      parameters:
        - $ref: '#/components/parameters/BoxId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: type
          in: query
          schema: { type: string }
          description: Comma-separated event type filter, for example `prompt,response`.
      responses:
        '200':
          description: >-
            The agent's work on the box (prompts, responses), not box
            lifecycle. A box that was never prompted returns an empty list even
            though it started, stopped and resumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsResponse' }
              examples:
                progress:
                  value:
                    ok: true
                    type: events.list
                    id: bx_23456789
                    events:
                      - id: prompt_123
                        type: prompt
                        timestamp: 1780347055370
                        taskId: prompt_123
                        data:
                          prompt: Run tests and summarize failures.
                          status: running
                          is_reverted: false
                      - id: response_123-tools
                        type: response
                        timestamp: 1780347063427
                        taskId: prompt_123
                        data:
                          content: ""
                          model: gpt-5.4
                          tools:
                            - use:
                                id: call_123
                                type: tool_use
                                name: Bash
                                input:
                                  command: npm test
                              result:
                                type: tool_result
                                tool_use_id: call_123
                                is_error: false
                                content: '{"exitCode":0}'
                          is_reverted: false
                      - id: response_123
                        type: response
                        timestamp: 1780347065650
                        taskId: prompt_123
                        data:
                          content: Tests passed.
                          model: gpt-5.4
                          is_reverted: false
                    pageInfo:
                      nextCursor: null
                      hasMore: false
                      limit: 100
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /boxes/{boxId}/prompts/{promptId}:
    get:
      tags: [Box]
      summary: Get prompt run status
      description: Returns first-class status for a queued/running/finished prompt so clients do not infer completion from box state and events.
      operationId: promptRunStatus
      parameters:
        - $ref: '#/components/parameters/BoxId'
        - name: promptId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Prompt run status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptRunResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /boxes/{boxId}/files:
    get:
      tags: [Box]
      summary: Read a file from a Box
      operationId: readFile
      parameters:
        - $ref: '#/components/parameters/BoxId'
        - name: path
          in: query
          required: true
          schema: { type: string, description: "Absolute path, or path relative to the Box work directory (/home/user). The canonicalized path must resolve under /home/user or /tmp; anything else is rejected with a 400 invalid_path error." }
        - name: encoding
          in: query
          schema: { type: string, enum: [utf8, base64], default: utf8 }
      responses:
        '200':
          description: File contents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileReadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
    put:
      tags: [Box]
      summary: Write a file in a Box
      operationId: writeFile
      parameters:
        - $ref: '#/components/parameters/BoxId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileWriteRequest' }
      responses:
        '200':
          description: File written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileWriteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /boxes/{boxId}/commands:
    post:
      tags: [Box]
      summary: Execute a command in a Box
      description: "Runs the command synchronously by default (timeout configurable via `timeoutSeconds`, 600s cap). With `detached: true` the command starts in the background and a process id is returned immediately; poll `/boxes/{boxId}/commands/{processId}` for status and logs. Returns 400 invalid_timeout when `timeoutSeconds` is not an integer in 1-600. Returns 409 box_starting (retryable) while the Box is still provisioning -- wait until the Box state is ready before running commands. Command execution is never retried automatically: a 502 box_direct_failed means the command may already be running on the Box."
      operationId: command
      parameters:
        - $ref: '#/components/parameters/BoxId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '200':
          description: Command result (synchronous) or process start confirmation (detached).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CommandResponse'
                  - $ref: '#/components/schemas/CommandStartedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /boxes/{boxId}/commands/{processId}:
    get:
      tags: [Box]
      summary: Get detached command status and logs
      operationId: commandStatus
      parameters:
        - $ref: '#/components/parameters/BoxId'
        - $ref: '#/components/parameters/ProcessId'
        - name: tailBytes
          in: query
          schema: { type: integer, minimum: 1, maximum: 524288 }
          description: Cap each returned log to its last N bytes. Defaults to 524288 (512 KiB).
      responses:
        '200':
          description: Process status and log tails.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandStatusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /boxes/{boxId}/artifacts:
    get:
      tags: [Box]
      summary: Download a Box artifact
      operationId: artifact
      parameters:
        - $ref: '#/components/parameters/BoxId'
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Artifact bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /boxes/{boxId}/interrupt:
    post:
      tags: [Box]
      summary: Interrupt running work
      operationId: interrupt
